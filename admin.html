<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Ligi | Yönetici Girişi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1120;
            color: #f1f5f9;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            background: #111b2e;
            border: 1px solid #26344b;
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 25px;
        }

        p {
            color: #94a3b8;
            text-align: center;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 24px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #334155;
            background: #0b1120;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #22c55e;
            color: #07130b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            min-height: 20px;
            margin-top: 16px;
            font-size: 14px;
        }

        a {
            display: block;
            margin-top: 20px;
            color: #86efac;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>⚽ FC Ligi</h1>
        <p>Yönetici paneline giriş yap</p>

        <form id="login-form">
            <label for="password">Yönetici şifresi</label>
            <input
                id="password"
                type="password"
                placeholder="Şifreni gir"
                required
            >

            <button type="submit">Giriş Yap</button>
            <p id="message"></p>
        </form>

        <a href="/">← Puan tablosuna dön</a>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.textContent = "Kontrol ediliyor...";

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Giriş başarısız.");
                }

                window.location.href = "/admin-panel.html";
            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
